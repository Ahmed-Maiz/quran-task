<div class="container-max" style="margin-top: 30px; padding: 0 20px">
  <nz-table #basicTable [nzData]="surahs()" [nzBordered]="true" nzSize="middle">
    <thead>
      <tr>
        <th nzAlign="center" style="background-color: #16a34a; color: white">رقم السورة</th>
        <th nzAlign="center" style="background-color: #16a34a; color: white">اسم السورة</th>
        <th nzAlign="center" style="background-color: #16a34a; color: white">الاسم بالإنجليزية</th>
        <th nzAlign="center" style="background-color: #16a34a; color: white">عدد الآيات</th>
        <th nzAlign="center" style="background-color: #16a34a; color: white">النوع</th>
      </tr>
    </thead>
    <tbody>
      @for (item of basicTable.data; track item.surah_number) {
        <tr>
          <td nzAlign="center">
            <span class="surah-badge">{{ item.surah_number }}</span>
          </td>
          <td nzAlign="center" style="color: #15803d; font-weight: bold">{{ item.name_ar }}</td>
          <td nzAlign="center" style="color: #666; font-style: italic">{{ item.name_en }}</td>
          <td nzAlign="center">{{ item.ayahs_count }}</td>
          <td nzAlign="center">
            <nz-tag [nzColor]="item.revelation_type === 'meccan' ? 'orange' : 'green'">
              {{ item.revelation_type }}
            </nz-tag>
          </td>
        </tr>
      }
    </tbody>
  </nz-table>
</div>
